---
- name: "ANSSI | Kernel | Paramètres sysctl sécurité"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: "net.ipv4.conf.all.accept_redirects",  value: "0" }
    - { key: "net.ipv4.conf.all.send_redirects",    value: "0" }
    - { key: "net.ipv4.tcp_syncookies",             value: "1" }
    - { key: "kernel.dmesg_restrict",               value: "1" }
    - { key: "kernel.randomize_va_space",           value: "2" } 

- name: "ANSSI | SSH | Désactivation login root"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  notify: restart sshd

- name: "ANSSI | SSH | Authentification par clé uniquement"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  notify: restart sshd

- name: "ANSSI | UFW | Installation"
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: "ANSSI | UFW | Politique par défaut : tout bloquer"
  community.general.ufw:
    policy: deny
    direction: incoming

- name: "ANSSI | UFW | Ouverture port SSH (22)"
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: "ANSSI | UFW | Ouverture port Backend C++ (9090)"
  community.general.ufw:
    rule: allow
    port: "9090"
    proto: tcp

- name: "ANSSI | UFW | Ouverture port Frontend Nginx (8080)"
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: "ANSSI | UFW | Activation"
  community.general.ufw:
    state: enabled

- name: "ANSSI | Bannière | Avertissement légal Défense"
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: |
      ===========================================================
      ⚠️  SYSTÈME D'INFORMATION RESTREINT — EXAIL
      Accès réservé aux personnels habilités.
      Toute intrusion est traçable et pénalement répréhensible.
      ===========================================================
    mode: '0644'