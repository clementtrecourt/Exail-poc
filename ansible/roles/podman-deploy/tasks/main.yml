---
- name: "Podman | Installation"
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true

- name: "Sécurité | Création compte service exail_svc"
  ansible.builtin.user:
    name: exail_svc
    shell: /sbin/nologin
    create_home: true

- name: "Air-Gapped | Transfert des archives .tar vers la VM"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: '0600'
  loop:
    - exail-backend.tar
    - exail-frontend.tar

- name: "Podman | Chargement images"
  ansible.builtin.command: "podman load -i /tmp/{{ item }}"
  loop:
    - exail-backend.tar
    - exail-frontend.tar
  register: load_result
  changed_when: true

- debug:
    var: load_result.results
  
- name: "Lancement du Backend C++"
  containers.podman.podman_container:
    name: exail-backend
    image: "localhost/exail-backend:v2" 
    state: started
    pull: never
    ports:
      - "9090:9090"
    cap_drop:
      - ALL
  register: backend_start
  ignore_errors: true 

- name: "Lancement du Frontend Vue.js"
  containers.podman.podman_container:
    name: exail-frontend
    image: "localhost/exail-frontend:v2"
    state: started
    pull: never
    ports:
      - "8080:8080"
    cap_drop:
      - ALL
  register: frontend_start
  ignore_errors: true

- name: "Nettoyage | Suppression archives .tar de /tmp"
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - exail-backend.tar
    - exail-frontend.tar