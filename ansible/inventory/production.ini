[production]
vm-prod       ansible_host=192.168.121.103 ansible_ssh_private_key_file="{{ playbook_dir }}/../infra/vagrant/.vagrant/machines/vm-prod/libvirt/private_key"

[edge]
vm-drone ansible_host=192.168.121.2   ansible_ssh_private_key_file="{{ playbook_dir }}/../infra/vagrant/.vagrant/machines/vm-drone/libvirt/private_key"

[monitoring]
